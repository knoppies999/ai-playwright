# Mirror of azure-pipelines/ci.yml, so pull requests on GitHub get the same checks.
# No LLM calls and no public-app calls, so no secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Not a real secret: the demo spec types it, and the leak check proves it appears nowhere (docs/08 §4).
  DEMO_INITIAL_PASSWORD: ci-leak-check-Pw-4417

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright test --project fixtures --project demo
      - run: node scripts/leak-check.mjs DEMO_INITIAL_PASSWORD
