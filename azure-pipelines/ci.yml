# CI for the framework repo itself (Phase 1): lint, typecheck, build, unit tests.
# No LLM calls and no public-app calls (risk R13), so it needs no secrets.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

pool: { vmImage: ubuntu-latest }

variables:
  # Not a real secret: the demo spec types it, and the leak check proves it appears nowhere (docs/08 §4).
  DEMO_INITIAL_PASSWORD: ci-leak-check-Pw-4417

steps:
  - task: UseNode@1
    inputs: { version: '22.x' }

  - script: npm ci
    displayName: Install

  - script: npx playwright install --with-deps chromium
    displayName: Install Chromium (unit tests use static pages)

  - script: npm run lint
    displayName: Lint

  - script: npm run typecheck
    displayName: Typecheck

  - script: npm run build
    displayName: Build

  - script: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit-junit.xml
    displayName: Unit tests

  - script: npx playwright test --project fixtures --project demo
    displayName: Engine and healing e2e with FakeProvider (no AI, localhost only)

  - script: node scripts/leak-check.mjs DEMO_INITIAL_PASSWORD
    displayName: Secret leak check (results, reports, plans, unzipped traces)

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/unit-junit.xml
      testRunTitle: Unit tests
